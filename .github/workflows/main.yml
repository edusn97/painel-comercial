name: Painel Comercial

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Escrever os tokens (a partir dos Secrets)
        env:
          CE_TOKENS: ${{ secrets.CLINICA_EXPERTS_TOKENS_JSON }}
          PV_TOKEN: ${{ secrets.PAPERVINES_TOKEN }}
        run: |
          mkdir -p config
          printf '%s' "$CE_TOKENS" > config/clinica-experts-tokens.json
          printf '%s' "$PV_TOKEN" > config/papervines-token.txt

      - name: Gerar o painel
        shell: pwsh
        run: ./Puxar-Funil-PaperVines.ps1 -nopause

      - name: Publicar no Netlify (CLI oficial)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          npm install -g netlify-cli@17
          netlify deploy --prod --dir=site --site="${{ secrets.NETLIFY_SITE }}"
