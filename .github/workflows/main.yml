name: Painel Comercial

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Escrever os tokens (a partir dos Secrets)
        env:
          CE_TOKENS: ${{ secrets.CLINICA_EXPERTS_TOKENS_JSON }}
          PV_TOKEN: ${{ secrets.PAPERVINES_TOKEN }}
          NF_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NF_SITE: ${{ secrets.NETLIFY_SITE }}
        run: |
          mkdir -p config
          printf '%s' "$CE_TOKENS" > config/clinica-experts-tokens.json
          printf '%s' "$PV_TOKEN" > config/papervines-token.txt
          printf '%s' "$NF_TOKEN" > config/netlify-token.txt
          printf '%s' "$NF_SITE" > config/netlify-site.txt

      - name: Gerar o painel e publicar no Netlify
        shell: pwsh
        env:
          CE_SJ_JWT: ${{ secrets.CE_SJ_JWT }}
          CE_JV_JWT: ${{ secrets.CE_JV_JWT }}
        run: ./Puxar-Funil-PaperVines.ps1 -nopause
